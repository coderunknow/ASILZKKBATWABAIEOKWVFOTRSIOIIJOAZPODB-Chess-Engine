name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format (rustfmt)
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo clippy --release --all-targets --message-format=json -- -D warnings > clippy.log 2>&1
          status=$?
          set -e
          python3 - << 'PY'
          import json, re
          count = 0
          for raw in open('clippy.log', errors='replace'):
              raw = raw.strip()
              if not raw.startswith('{'):
                  continue
              try:
                  obj = json.loads(raw)
              except Exception:
                  continue
              if obj.get('reason') != 'compiler-message':
                  continue
              m = obj.get('message', {})
              if m.get('level') not in ('error',):
                  continue
              code = (m.get('code') or {}).get('code', 'rustc')
              text = re.sub(r'\x1b\[[0-9;]*m', '', m.get('message', '')).replace('\n', ' | ').replace('%', ' percent ').strip()
              spans = [s for s in m.get('spans', []) if s.get('is_primary')] or m.get('spans', [])
              if spans:
                  s0 = spans[0]
                  print('::error file={},line={},col={},title={}::{}'.format(
                      s0.get('file_name', '?'), s0.get('line_start', 1),
                      s0.get('column_start', 1), code, text[:480]))
              else:
                  print('::error title={}::{}'.format(code, text[:480]))
              count += 1
          if status != 0:
              log = re.sub(r'\x1b\[[0-9;]*m', '', open('clippy.log', errors='replace').read()).replace('%', ' percent ')
              print('::error title=clippy-log-tail::' + log[-1500:].replace('\n', ' | '))
          print('::notice::clippy diagnostics emitted: {} error(s)'.format(count))
          PY
          exit $status

      - name: Clippy verdict
        if: steps.clippy.outcome == 'failure'
        run: |
          echo "::error::clippy failed"
          exit 1

      - name: Tests (release)
        run: cargo test --release --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Bench (informational — prints fixed-depth-10 signature)
        continue-on-error: true
        shell: bash
        run: |
          ./target/release/flawless bench | tee "bench-signature-${{ matrix.os }}.txt"

      - name: Stage release binary evidence (SHA-256 + commit)
        continue-on-error: true
        shell: bash
        run: |
          sha256sum target/release/flawless > "release-binary-${{ matrix.os }}.sha256"
          printf 'git_commit=%s\nbinary=%s\n'             "${{ github.sha }}" "target/release/flawless" > "release-manifest-${{ matrix.os }}.txt"

      - name: Upload evidence artifacts (bench signature, binary SHA-256, manifest)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flawless-evidence-${{ matrix.os }}
          path: |
            bench-signature-${{ matrix.os }}.txt
            release-binary-${{ matrix.os }}.sha256
            release-manifest-${{ matrix.os }}.txt
          if-no-files-found: warn
          retention-days: 90

      - name: UCI handshake smoke test
        shell: bash
        run: |
          out=$(printf 'uci\nisready\nquit\n' | ./target/release/flawless uci)
          echo "$out"
          echo "$out" | grep -q '^uciok$' || { echo "missing uciok"; exit 1; }
          echo "$out" | grep -q '^readyok$' || { echo "missing readyok"; exit 1; }

      - name: UCI bestmove smoke test (search depth 2)
        shell: bash
        run: |
          out=$(printf 'uci\nisready\nposition startpos\ngo depth 2\nquit\n' | ./target/release/flawless uci)
          echo "$out"
          echo "$out" | grep -Eq '^bestmove [a-h][1-8][a-h][1-8]([qrbn])?' || { echo "no legal bestmove"; exit 1; }

      - name: Perft sanity (depth 3 startpos)
        shell: bash
        run: |
          out=$(./target/release/flawless perft 3)
          echo "$out"
          echo "$out" | grep -q '8902' || { echo "perft d3 mismatch"; exit 1; }

  msrv:
    name: msrv (rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0

      - name: Check on MSRV
        run: cargo check --release --locked
        env:
          RUSTUP_TOOLCHAIN: "1.80.0"
          CARGO_NET_OFFLINE: "false"
