name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format (rustfmt)
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests (release)
        run: cargo test --release --locked

      - name: Release build
        run: cargo build --release --locked

      - name: UCI handshake smoke test
        shell: bash
        run: |
          out=$(printf 'uci\nisready\nquit\n' | ./target/release/asilzkkbbatwabaieokwvfotrsioiij uci 2>/dev/null || true)
          echo "$out"
          echo "$out" | grep -q '^uciok$' || { echo "missing uciok"; exit 1; }
          echo "$out" | grep -q '^readyok$' || { echo "missing readyok"; exit 1; }

      - name: Perft sanity (depth 3 startpos)
        shell: bash
        run: |
          out=$(./target/release/asilzkkbbatwabaieokwvfotrsioiij perft 3 2>/dev/null || true)
          echo "$out"
          echo "$out" | grep -q '8902' || { echo "perft d3 mismatch"; exit 1; }
