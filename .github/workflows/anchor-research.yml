# anchor-research.yml — retrieve authoritative CCRL 40/15 rating data from a hosted runner.
#
# Rationale: the dev sandbox has restricted egress (computerchess.org.uk -> curl 000), but
# GitHub-hosted runners have open egress. This workflow fetches the official list, records
# exact provenance (URL, HTTP status, headers, UTC timestamp, SHA-256), parses the table to
# CSV, and uploads everything as an artifact for offline anchor selection.
#
# Deliberate execution only: it runs on `workflow_dispatch` (once this file is on the default
# branch) or when this file itself changes in a PR (one-shot research fetch; it is cheap —
# seconds of web fetches, not a tournament).
#
# Nothing here is rating evidence by itself. It is source material for the anchor pool, which
# must still be verified per docs/RATING_PROTOCOL.md §2 (version, binary SHA-256, license,
# published Elo + uncertainty convention) before preregistration.

name: anchor-research

on:
  workflow_dispatch:
    inputs:
      primary_url:
        description: "Primary CCRL 40/15 list URL"
        required: false
        default: "https://computerchess.org.uk/4040/rating_list_all.html"
  pull_request:
    paths:
      - ".github/workflows/anchor-research.yml"

jobs:
  fetch-ccrl-4015:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record runner hardware and software
        run: |
          set -x
          {
            echo "=== utc: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            uname -a
            echo "--- os-release ---"; cat /etc/os-release
            echo "--- lscpu ---"; lscpu
            echo "--- meminfo ---"; head -5 /proc/meminfo
            echo "--- df ---"; df -h /
            echo "--- runner image ---"; echo "${ImageOS:-unknown} ${ImageVersion:-unknown}"
            python3 --version
            curl --version | head -1
          } > hardware.txt 2>&1
          cat hardware.txt

      - name: Fetch official CCRL 40/15 list (primary + fallbacks)
        env:
          PRIMARY: ${{ github.event.inputs.primary_url || 'https://computerchess.org.uk/4040/rating_list_all.html' }}
        run: |
          set -u
          mkdir -p fetch
          : > fetch/attempts.txt
          i=0
          for url in "$PRIMARY" \
                     "https://computerchess.org.uk/4040/rating_list_all.html" \
                     "https://www.computerchess.org.uk/ccrl/40-15/" \
                     "https://computerchess.org.uk/ccrl/40-15/rating_list_all.html"; do
            i=$((i+1))
            [ "$i" -gt 1 ] && [ "$url" = "$PRIMARY" ] && continue
            out="fetch/attempt_${i}.body"
            hdr="fetch/attempt_${i}.headers"
            code=$(curl -sS -L --max-time 120 -A "FlawLessChess-anchor-research/1.0 (rating anchor verification)" \
                          -D "$hdr" -o "$out" -w '%{http_code}' "$url" 2>fetch/attempt_${i}.stderr) || code="curl-exit-$?"
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            sha=$(sha256sum "$out" 2>/dev/null | cut -d' ' -f1 || echo none)
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) url=$url status=$code bytes=$bytes sha256=$sha" | tee -a fetch/attempts.txt
          done
          echo "--- attempts ---"; cat fetch/attempts.txt

      - name: Parse rating table to CSV (best effort) and summarize
        run: |
          python3 - <<'PY'
          import csv, glob, hashlib, json, os, re, sys
          from datetime import datetime, timezone

          manifest = {"retrieved_utc": datetime.now(timezone.utc).isoformat(),
                      "attempts": [], "parse": {}}
          for line in open("fetch/attempts.txt"):
              parts = dict(p.split("=", 1) for p in line.split()[1:] if "=" in p)
              manifest["attempts"].append(parts)

          rows_all = []
          best = None
          for body in sorted(glob.glob("fetch/attempt_*.body")):
              if os.path.getsize(body) < 1024:
                  continue
              html = open(body, encoding="utf-8", errors="replace").read()
              # CCRL list pages are plain HTML tables: Engine, Games, Score, Error, ...
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", html, flags=re.S | re.I)
              parsed = []
              for r in rows:
                  cells = [re.sub(r"<[^>]+>", "", c).replace("&nbsp;", " ").strip()
                           for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", r, flags=re.S | re.I)]
                  if len(cells) >= 3:
                      parsed.append(cells)
              manifest["parse"][body] = {"table_rows": len(rows), "parsed_rows": len(parsed)}
              if len(parsed) > (len(rows_all)):
                  best, rows_all = body, parsed

          if rows_all:
              with open("ccrl_4015_parsed.csv", "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerows(rows_all)
              manifest["best_source"] = best
              manifest["best_source_sha256"] = hashlib.sha256(open(best, "rb").read()).hexdigest()
              # Print a compact sample (first 15 rows) into the job log for immediate viewing.
              print("=== first parsed rows from", best, "===")
              for r in rows_all[:15]:
                  print(" | ".join(r)[:200])
          else:
              manifest["best_source"] = None

          json.dump(manifest, open("fetch_manifest.json", "w"), indent=2)
          print(json.dumps(manifest["parse"], indent=2))
          PY

      - name: Extract methodology and error-convention text
        run: |
          python3 - <<'PY'
          import glob, html, os, re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          body_path = "fetch/attempt_1.body"
          if not os.path.exists(body_path):
              emit("error", "no primary list body")
              raise SystemExit(0)
          raw = open(body_path, encoding="utf-8", errors="replace").read()
          text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
          text = re.sub(r"\s+", " ", text)
          for key in ("Testing summary", "testing conditions", "error", "Error"):
              idx = text.find(key)
              if idx != -1:
                  emit("notice", f"context around {key!r}:\n" + text[max(0, idx - 300): idx + 1400])
                  break
          m = re.search(r"(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+\d{4}", text)
          emit("notice", f"list_date_text: {m.group(0) if m else 'NOT FOUND'}")
          PY

      - name: Probe anchor-candidate binary availability (GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          def gh(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "anchor-research"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # High-confidence homes first, then name-search fallbacks for the rest.
          pinned = {
              "Arasan": "jdart1/arasan", "Demolito": "lucasart/demolito",
              "Weiss": "TerjeKir/Weiss", "Stash": "mhouppin/stash-bot",
              "Igel": "vshcherbyna/igel", "FabChess": "fabianvdW/FabChess",
          }
          search_names = ["Topple chess", "Counter chess engine", "Cheese chess engine",
                          "akimbo chess engine", "Kimbo chess engine", "CT800 chess",
                          "Halogen chess engine", "WyldChess", "Winter chess engine",
                          "Monolith chess engine", "Gaviota chess", "Laser chess engine"]
          out = []
          for name, repo in pinned.items():
              try:
                  lic = gh(f"/repos/{repo}").get("license") or {}
                  rel = gh(f"/repos/{repo}/releases?per_page=5")
                  tags = [(r.get("tag_name"), [a["name"] for a in r.get("assets", [])][:6]) for r in rel[:3]]
                  out.append(f"{name}: repo={repo} license={lic.get('spdx_id')} releases={tags}")
              except Exception as e:
                  out.append(f"{name}: repo={repo} ERROR {e}")
          for q in search_names:
              try:
                  res = gh(f"/search/repositories?q={urllib.parse.quote(q)}&per_page=2")
                  for it in res.get("items", [])[:2]:
                      lic = (it.get("license") or {}).get("spdx_id")
                      out.append(f"{q!r}: hit={it['full_name']} license={lic} stars={it['stargazers_count']}")
              except Exception as e:
                  out.append(f"{q!r}: SEARCH ERROR {e}")
          for chunk_start in range(0, min(len(out), 18), 6):
              emit("notice", "binary probe:\n" + "\n".join(out[chunk_start:chunk_start + 6]))
          PY

      - name: Fetch about + downloads pages (error convention, binary sources)
        run: |
          set -u
          python3 - <<'PY' > /tmp/urls.txt
          import glob, re
          body = open("fetch/attempt_1.body", encoding="utf-8", errors="replace").read()
          hrefs = set(re.findall(r'href="([^"]+)"', body))
          for h in sorted(hrefs):
              if re.search(r"about|download", h, re.I):
                  print(h)
          PY
          cat /tmp/urls.txt
          i=0
          while read -r u; do
            i=$((i+1))
            case "$u" in http*) url="$u";; /*) url="https://computerchess.org.uk$u";; *) url="https://computerchess.org.uk/4040/$u";; esac
            code=$(curl -sS -L --max-time 90 -A "FlawLessChess-anchor-research/1.0" -o "fetch/extra_${i}.body" -w '%{http_code}' "$url" 2>fetch/extra_${i}.stderr) || code="curl-exit-$?"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) url=$url status=$code bytes=$(wc -c < fetch/extra_${i}.body 2>/dev/null || echo 0) sha256=$(sha256sum fetch/extra_${i}.body 2>/dev/null | cut -d' ' -f1)" | tee -a fetch/attempts.txt
          done < /tmp/urls.txt

      - name: Extract error-bar convention and candidate engine rows
        run: |
          python3 - <<'PY'
          import glob, html, os, re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          # 1) Error-bar / uncertainty convention from any fetched page.
          emitted_conv = 0
          for path in sorted(glob.glob("fetch/*.body")):
              if emitted_conv >= 3:
                  break
              raw = open(path, encoding="utf-8", errors="replace").read()
              text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              text = re.sub(r"\s+", " ", text)
              for pat in (r"[^.]*\berror bars?[^.]*\.", r"[^.]*\bconfidence[^.]*\.",
                          r"[^.]*Bayeselo[^.]*\.", r"[^.]*\buncertaint[^.]*\.",
                          r"[^.]*\bElo \+[^.]*\."):
                  for m in re.finditer(pat, text, flags=re.I):
                      seg = m.group(0).strip()
                      if 20 <= len(seg) <= 600:
                          emit("notice", f"convention ({os.path.basename(path)}): {seg}")
                          emitted_conv += 1
                  if emitted_conv:
                      break

          # 2) ALL rows of candidate engines across the whole list (every version),
          #    so an exact version<->rating mapping exists per candidate. Chunked
          #    into few annotations (step cap ~10).
          names = ["akimbo", "Halogen", "Topple", "Weiss", "Demolito", "FabChess", "Igel",
                   "Stash", "Counter", "WyldChess", "Kimbo", "Cheese", "CT800", "Winter",
                   "Monolith", "Laser", "Nemorino", "RubiChess", "Ethereal", "Berserk",
                   "Gaviota", "Arasan"]
          rows = [l.rstrip("\n") for l in open("ccrl_4015_parsed.csv", encoding="utf-8", errors="replace")]
          lines = []
          for n in names:
              hits = [r for r in rows if re.search(rf"\b{re.escape(n)}\b", r, flags=re.I)]
              if hits:
                  lines.append(f"== {n} ({len(hits)} rows) ==")
                  lines.extend(hits[:8])
          text = "\n".join(lines)
          emit("notice", f"candidate version rows ({len(lines)} lines):\n" + text[:14000])
          PY

      - name: Probe release tags for resolved anchor-candidate repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          def gh(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "anchor-research"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          repos = ["jw1912/akimbo", "KierenP/Halogen", "konsolas/ToppleChess",
                   "Mk-Chan/WyldChess", "ChizhovVadim/CounterGo", "lucasart/demolito",
                   "TerjeKir/Weiss", "fabianvdW/FabChess", "vshcherbyna/igel",
                   "mhouppin/stash-bot"]
          out = []
          for repo in repos:
              try:
                  rel = gh(f"/repos/{repo}/releases?per_page=8")
                  tags = [(r.get("tag_name"), [(a["name"], a["size"]) for a in r.get("assets", [])][:5]) for r in rel[:5]]
                  out.append(f"{repo}: releases={tags}")
              except Exception as e:
                  out.append(f"{repo}: RELEASES-ERROR {e}")
              try:
                  tags = gh(f"/repos/{repo}/tags?per_page=8")
                  out.append(f"{repo}: tags={[t['name'] for t in tags[:8]]}")
              except Exception as e:
                  out.append(f"{repo}: TAGS-ERROR {e}")
          for chunk_start in range(0, min(len(out), 16), 4):
              emit("notice", "release probe:\n" + "\n".join(out[chunk_start:chunk_start + 4]))
          PY

      - name: Full version rows for buildable families
        run: |
          python3 - <<'PY'
          import re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          rows = [l.rstrip("\n") for l in open("ccrl_4015_parsed.csv", encoding="utf-8", errors="replace")]
          lines = []
          for n in ("Raven", "Stash", "Pirarucu", "Topple", "akimbo", "WyldChess", "FabChess", "Monolith", "Carballo"):
              hits = [r for r in rows if re.search(rf"\b{re.escape(n)}\b", r, flags=re.I)]
              lines.append(f"== {n} ({len(hits)} rows) ==")
              lines.extend(hits)
          text = "\n".join(lines)
          emit("notice", f"buildable-family rows ({len(lines)} lines):\n" + text[:13500])
          PY

      - name: Lower-band rows and extra engine families
        run: |
          python3 - <<'PY'
          import re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          rows = [l.rstrip("\n") for l in open("ccrl_4015_parsed.csv", encoding="utf-8", errors="replace")]

          def row_rating(r):
              for c in r.split(","):
                  c = c.strip().strip('"')
                  if re.fullmatch(r"\d{3,4}(\.\d+)?", c):
                      v = float(c)
                      if 800 <= v <= 4000:
                          return v
              return None

          # Below-band candidates (possible anchors under 2200): sample evenly.
          lower = [r for r in rows if (rt := row_rating(r)) and 1700 <= rt <= 2200]
          emit("notice", f"rows_in_1700_2200={len(lower)}")
          step = max(1, len(lower) // 45)
          sample = lower[::step][:45]
          for chunk_start in range(0, len(sample), 15):
              emit("notice", f"lower band sample [{chunk_start}..]:\n" + "\n".join(sample[chunk_start:chunk_start + 15]))

          # Extra open-source families with potential old-version coverage.
          names = ["Ethereal", "Winter", "Monolith", "Stash", "Gaviota", "Arasan", "Fruit",
                   "Toga", "Glaurung", "Crafty", "Vice", "Hakkapeliitta", "Bobcat", "Rodent",
                   "Daydreamer", "Phalanx", "Cheng", "DisasterArea", "Laser", "Nemorino",
                   "RubiChess", "Berserk", "Texel"]
          lines = []
          for n in names:
              hits = [r for r in rows if re.search(rf"\b{re.escape(n)}\b", r, flags=re.I)]
              if hits:
                  lines.append(f"== {n} ({len(hits)} rows) ==")
                  lines.extend(hits[:6])
          text = "\n".join(lines)
          emit("notice", f"extra family rows ({len(lines)} lines):\n" + text[:10000])
          PY

      - name: Extract homepage links for candidate rows
        run: |
          python3 - <<'PY'
          import re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          body = open("fetch/attempt_1.body", encoding="utf-8", errors="replace").read()
          all_anchors = re.findall(r"<a\s[^>]*>", body, flags=re.I)
          emit("notice", f"anchor_tags_total={len(all_anchors)}")
          links = dict()
          for m in re.finditer(r'<a\s[^>]*href=["\']?(https?://[^"\'>\s]+)["\']?[^>]*>([^<]{2,60})</a>',
                               body, flags=re.I):
              url, name = m.group(1), m.group(2).strip()
              for key in ("akimbo", "Topple", "WyldChess", "Halogen", "Cheese", "Counter",
                          "Kimbo", "CT800", "Gaviota", "Arasan", "Ethereal", "Winter",
                          "Monolith", "Stash", "Fruit", "Toga", "Glaurung", "Crafty",
                          "Vice", "Hakkapeliitta", "Bobcat", "Rodent", "Daydreamer",
                          "Phalanx", "Weiss", "Demolito", "FabChess", "Igel", "Laser",
                          "Nemorino", "RubiChess", "Berserk", "Texel", "Carballo",
                          "Hedgehog", "Schola", "Bubble", "Rival", "Mediocre", "Neurosis",
                          "Weini", "Zevra", "Pirarucu", "AdroitChess", "Embla", "GopherCheck"):
                  if re.search(rf"\b{key}\b", name, flags=re.I):
                      links.setdefault(key, set()).add((name, url))
          out = []
          for key in sorted(links):
              for name, url in sorted(links[key])[:3]:
                  out.append(f"{key}: [{name}] {url}")
          if not out:
              out.append("NO matching engine links found in body")
          for chunk_start in range(0, min(len(out), 18), 6):
              emit("notice", "homepages:\n" + "\n".join(out[chunk_start:chunk_start + 6]))
          PY

      - name: Full tag lists and below-band repo search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          def gh(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "anchor-research"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          out = []
          for repo in ("jw1912/akimbo", "konsolas/ToppleChess", "Mk-Chan/WyldChess"):
              try:
                  tags = gh(f"/repos/{repo}/tags?per_page=100")
                  out.append(f"{repo}: ALL tags={[t['name'] for t in tags]}")
              except Exception as e:
                  out.append(f"{repo}: TAGS-ERROR {e}")
          for q in ("carballo chess engine", "Hedgehog chess engine", "schola chess engine",
                    "rival chess engine", "mediocre chess engine", "neurosis chess engine",
                    "weini chess", "zevra chess", "pirarucu chess", "CT800 Rasmus",
                    "bubble chess engine", "adroit chess engine", "embla chess engine",
                    "gophercheck"):
              try:
                  res = gh(f"/search/repositories?q={urllib.parse.quote(q)}&per_page=2")
                  for it in res.get("items", [])[:2]:
                      lic = (it.get("license") or {}).get("spdx_id")
                      out.append(f"{q!r}: hit={it['full_name']} license={lic} stars={it['stargazers_count']}")
              except Exception as e:
                  out.append(f"{q!r}: SEARCH ERROR {e}")
          for chunk_start in range(0, min(len(out), 16), 4):
              emit("notice", "tags+search probe:\n" + "\n".join(out[chunk_start:chunk_start + 4]))
          PY

      - name: Hash all fetched files
        run: |
          {
            echo "=== utc: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            find fetch -type f | sort | xargs sha256sum
            [ -f ccrl_4015_parsed.csv ] && sha256sum ccrl_4015_parsed.csv
            [ -f fetch_manifest.json ] && sha256sum fetch_manifest.json
          } | tee SHA256SUMS.txt

      # Annotations are the only channel readable from the dev sandbox (job logs
      # and artifact blobs are unreachable there). Emit compact provenance +
      # candidate anchor rows in the ~2,000-2,450 band as check annotations.
      - name: Report fetch provenance via annotations
        run: |
          python3 - <<'PY'
          import os, re, json

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          for line in open("fetch/attempts.txt"):
              emit("notice", "fetch: " + line.strip())
          if not os.path.exists("fetch_manifest.json"):
              emit("error", "no fetch_manifest.json produced")
              raise SystemExit(0)
          m = json.load(open("fetch_manifest.json"))
          emit("notice", f"parse: {json.dumps(m['parse'])} best_source={m.get('best_source')}")
          PY

      - name: Report candidate anchor rows via annotations
        run: |
          python3 - <<'PY'
          import os, re

          def emit(level, text):
              text = re.sub(r"\r?\n", "%0A", text)
              while text:
                  print(f"::{level}::{text[:3500]}")
                  text = text[3500:]

          if not os.path.exists("ccrl_4015_parsed.csv"):
              emit("error", "no rows parsed from any fetched list body")
              raise SystemExit(0)
          rows = [l.rstrip("\n") for l in open("ccrl_4015_parsed.csv", encoding="utf-8", errors="replace")]
          emit("notice", f"parsed_rows_total={len(rows)}")

          def row_rating(cells):
              for c in cells.split(","):
                  c = c.strip().strip('"')
                  if re.fullmatch(r"\d{3,4}(\.\d+)?", c):
                      v = float(c)
                      if 800 <= v <= 4000:
                          return v
              return None

          band = [r for r in rows if (rt := row_rating(r)) and 1950 <= rt <= 2450]
          emit("notice", f"candidate_rows_in_1950_2450_band={len(band)}")
          for chunk_start in range(0, min(len(band), 45), 15):
              emit("notice", "band rows (csv):\n" + "\n".join(band[chunk_start:chunk_start + 15]))
          if not band:
              for chunk_start in range(0, min(len(rows), 30), 15):
                  emit("notice", f"first rows (csv) [{chunk_start}..]:\n"
                        + "\n".join(rows[chunk_start:chunk_start + 15]))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccrl-4015-fetch-${{ github.run_id }}
          path: |
            fetch/
            fetch_manifest.json
            SHA256SUMS.txt
            hardware.txt
            ccrl_4015_parsed.csv
